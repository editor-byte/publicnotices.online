<!-- Paste into the page's Code injection -> Page header -->
<style>

*,*::before,*::after{box-sizing:border-box}
.hcn-shell{
  --ink:#1a1a1a; --quiet:#5b5b57; --paper:#fafaf7; --chip:#eeece5;
  --land:#eceae2; --wardline:#d6d3c9; --edge:#4a4a46; --rule:#d7d5cc;
  --brand:#4a4a46; --accent:#4a4a46; --sea:#f4f3ee;
  --tip:#f7f9e9;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}

.hcn-masthead{background:var(--brand);color:#fafaf7;margin:-1.5rem -1.4rem 1rem;
  padding:1.15rem 1.4rem 1.05rem}
.hcn-masthead h1{color:#fafaf7;margin:0;font-weight:400}

.hcn-panel{flex:0 0 25rem;max-width:25rem;min-width:0;overflow-y:auto;
  padding:1.5rem 1.4rem 3rem;border-right:1px solid var(--rule)}
.hcn-stage{flex:1 1 auto;min-width:0;position:relative;
  background:var(--sea);overflow:hidden}
#hcn-map{position:absolute;inset:0}
h1{font-size:1.38rem;line-height:1.2;margin:0 0 .75rem;
  text-wrap:balance}
.hcn-standfirst{margin:0 0 1.1rem;color:var(--quiet);font-size:.97rem}
a{color:var(--brand);text-decoration:underline;
  text-underline-offset:2px;text-decoration-thickness:1px}
a:hover,a:focus{color:var(--ink);text-decoration-thickness:2px}
.hcn-search{display:flex;align-items:center;gap:.5rem;border:1px solid var(--rule);
  border-radius:999px;padding:.55rem 1rem;background:#fff;
  margin-bottom:.7rem}
.hcn-search svg{flex:0 0 auto;width:15px;height:15px}
.hcn-search input{border:0;outline:0;font:inherit;font-size:.97rem;width:100%;
  background:transparent;color:var(--ink)}
.hcn-kinds{display:flex;gap:.4rem;margin-bottom:.9rem}
.hcn-kinds button{font:inherit;font-size:.88rem;padding:.35rem .8rem;
  border:1px solid var(--rule);border-radius:999px;background:var(--paper);
  color:var(--ink);cursor:pointer}
.hcn-kinds button[aria-pressed=true]{background:var(--brand);color:#fafaf7;
  border-color:var(--brand)}
.hcn-nodl-toggle{display:flex;gap:.5rem;align-items:flex-start;
  margin:0 0 .9rem;font-size:.85rem;color:var(--quiet);cursor:pointer;
  line-height:1.35}
.hcn-nodl-toggle input{margin-top:.22rem;flex:0 0 auto}
.hcn-nodl-toggle b{color:var(--ink)}
.hcn-count{font-size:.93rem;color:var(--quiet);padding-bottom:.8rem;
  border-bottom:1px solid var(--rule);margin-bottom:1rem}
.hcn-count b{color:var(--ink);font-weight:400}
.sel{border-left:4px solid var(--rule);padding:.1rem 0 .1rem .8rem;
  margin:0 0 1.2rem}
.sel .hcn-tag{display:inline-block;font-size:.7rem;letter-spacing:.06em;
  text-transform:uppercase;background:var(--chip);border-radius:5px;
  padding:.22rem .55rem;margin-bottom:.4rem}
.sel h2{font-size:1.1rem;margin:0 0 .15rem}
.sel .hcn-sub{margin:0 0 .5rem;color:var(--quiet);font-size:.88rem}
.sel .hcn-it{border-top:1px solid var(--rule);padding-top:.5rem;margin-top:.5rem}
.sel .hcn-it b{display:block;font-size:.9rem;margin-bottom:.15rem}
.sel .hcn-it span{font-size:.88rem;color:var(--quiet)}
.sel .hcn-close{margin-top:.6rem;font-size:.9rem}
.hcn-legend{list-style:none;display:flex;flex-wrap:wrap;gap:.3rem 1rem;padding:0;
  margin:0 0 1.2rem;font-size:.85rem}
.hcn-legend li{display:flex;align-items:center;gap:.4rem}
.hcn-sw{display:inline-block;width:1.1em;height:.32em;border-radius:2px;
  flex:0 0 auto}
.hcn-sw.hcn-sq{width:.7em;height:.7em;border-radius:50%}
h3{font-size:1rem;margin:1.4rem 0 .4rem}
ul.hcn-rows{list-style:none;padding:0;margin:0}
.hcn-row{display:grid;grid-template-columns:1.3em 1fr;gap:.1rem .5rem;
  padding:.65rem 0;min-width:0;border-bottom:1px solid var(--rule);
  font-size:.9rem;overflow-wrap:anywhere}
.hcn-row .hcn-sw{grid-row:1;margin-top:.45em}
.hcn-row b{grid-column:2}
.hcn-row .hcn-meta,.hcn-row .hcn-dl{grid-column:2;color:var(--quiet);font-size:.84rem}
.hcn-row .hcn-dl{white-space:normal}
.hcn-row .hcn-sw{margin-top:.4rem}
.hcn-dl{color:var(--quiet);font-size:.88rem;white-space:nowrap}
.hcn-flag{color:#8a5a2b;font-size:.88rem}
.hcn-nodl{font-style:italic}
.hcn-sch{border-top:1px solid var(--rule);padding-top:.7rem;margin-top:.9rem}
.hcn-sch h4{font-size:1rem;margin:0 0 .2rem;display:flex;align-items:center;
  gap:.5rem}
.hcn-sch .hcn-adv{margin:.1rem 0 .35rem;color:var(--quiet);font-size:.85rem}
.hcn-sch ul{padding-left:1.05rem;margin:.3rem 0 0}
.hcn-sch li{font-size:.88rem;margin:.2rem 0}
.hcn-nopc{margin-top:1rem;font-size:.9rem;color:var(--quiet)}
[data-shut]{opacity:.55}
.hcn-currency{margin:1.2rem 0 0;font-size:.84rem;color:var(--quiet);
  border-top:1px solid var(--rule);padding-top:.8rem}
.hcn-currency b{color:var(--ink)}
.hcn-foot{margin-top:1rem;color:var(--quiet);font-size:.8rem}
.hcn-hide{display:none}
/* Ward names: drawn over the map in the page's own typeface, and taken
   away once the reader is close enough to read street names instead. */
.hcn-wl{font-size:12px;color:#6f6a52;text-align:center;line-height:1.15;
  font-family:Lora,Georgia,serif;pointer-events:none;white-space:nowrap;
  text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land)}
.hcn-stage[data-near] .hcn-wl{display:none}
.hcn-pin{cursor:pointer;width:26px;height:26px}
.hcn-pin svg{display:block;overflow:visible}
.hcn-pin circle,.hcn-pin rect{stroke:#fafaf7;stroke-width:2;
  vector-effect:non-scaling-stroke}
.hcn-pin text{fill:#fafaf7;font-size:11px;font-weight:600;text-anchor:middle;
  font-family:Lora,Georgia,serif;pointer-events:none}
.hcn-pin .hcn-gly{overflow:visible;pointer-events:none;color:var(--paper)}
.hcn-pin .hcn-mark{fill:var(--paper)}
.hcn-pin .hcn-mark [stroke]{stroke:var(--paper)}
.hcn-pin:hover circle,.hcn-pin:hover rect{stroke:var(--ink)}
.hcn-pin:focus{outline:none}
.hcn-pin:focus-visible circle,.hcn-pin:focus-visible rect{
  stroke:var(--ink);stroke-width:3.5}
.hcn-pin.hcn-on circle,.hcn-pin.hcn-on rect{stroke:var(--ink);stroke-width:3}
.hcn-zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;
  gap:.3rem;z-index:5}
.hcn-zoom button{font:inherit;width:2.1rem;height:2.1rem;border-radius:8px;
  border:1px solid var(--rule);background:#fff;color:var(--ink);
  cursor:pointer;font-size:1rem;line-height:1}
.hcn-mcard{position:absolute;left:16px;bottom:16px;width:min(24rem,64%);
  background:var(--paper);border-radius:12px;padding:1rem 1.1rem;
  box-shadow:0 12px 30px rgba(26,26,26,.26),0 2px 6px rgba(26,26,26,.12);
  font-size:.9rem;max-height:62%;overflow:auto;z-index:6;
  border-left:5px solid var(--rule)}
.hcn-mcard .hcn-tag{display:inline-block;font-size:.68rem;letter-spacing:.07em;
  text-transform:uppercase;background:var(--chip);border-radius:5px;
  padding:.25rem .6rem;margin-bottom:.5rem}
.hcn-mcard h2{font-size:1.15rem;margin:0 0 .15rem}
.hcn-mcard .hcn-sub{margin:0 0 .6rem;color:var(--quiet);font-size:.85rem}
.hcn-mcard .hcn-it{border-top:1px solid var(--rule);padding-top:.5rem;margin-top:.5rem}
.hcn-mcard .hcn-it b{display:block;font-size:.9rem;margin-bottom:.1rem}
.hcn-mcard .hcn-it b a{color:var(--ink)}
.hcn-mcard .hcn-it span{font-size:.86rem;color:var(--quiet)}
.hcn-mcard .hcn-close{margin-top:.7rem;font-size:.9rem;font-weight:600}
.hcn-mcard .hcn-more{display:inline-block;margin-top:.5rem;font-size:.86rem;
  color:var(--ink);text-decoration:underline;
  text-underline-offset:2px}
.hcn-mcard .hcn-x{position:absolute;right:.5rem;top:.4rem;border:0;background:none;
  font:inherit;font-size:1.2rem;line-height:1;color:var(--quiet);
  cursor:pointer;padding:.2rem .4rem}
.hcn-hint{position:absolute;left:14px;bottom:14px;z-index:4;background:var(--paper);
  border-radius:999px;padding:.4rem .9rem;font-size:.82rem;color:var(--quiet);
  box-shadow:0 2px 8px rgba(0,0,0,.1)}
.maplibregl-ctrl-attrib{font-family:Lora,Georgia,serif;font-size:.72rem}
@media (max-width:1100px){
  .hcn-panel{flex:0 0 20rem;max-width:20rem}
}
@media (max-width:860px){
  
  /* On a phone the map comes first: a reader wants to find their street,
     not read a list. The panel follows it. */
  .hcn-shell{display:flex;flex-direction:column}
  .hcn-stage{order:-1;height:62vh;min-height:20rem;
    border-bottom:1px solid var(--rule)}
  .hcn-panel{max-width:none;flex:none;width:100%;border-right:0;
    padding-top:1.1rem}
  /* The masthead is full-bleed in the panel, so it needs no negative top
     margin once the map sits above it. */
  .hcn-masthead{margin:-1.1rem -1.4rem 1.2rem}
  /* Over the bottom of the map, where a reader can see it without
     scrolling away from the marker they tapped. */
  .hcn-mcard{left:.6rem;right:.6rem;bottom:.6rem;width:auto;max-height:70%;
    box-shadow:0 6px 18px rgba(26,26,26,.22)}
  .hcn-hint{display:none}
}

/* A box in an article, not a window: the map takes a fixed height at the
   top and the panel runs beneath it, so a reader meets the map first. */
.hcn-shell{display:flex;flex-direction:column;max-width:100%;
  font-family:Lora,Georgia,serif;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);margin:2.5rem 0 1rem}
.hcn-shell .hcn-stage{order:-1;flex:none;height:min(70vh,34rem);
  min-height:20rem;position:relative;overflow:hidden;
  border-bottom:1px solid var(--rule)}
.hcn-shell .hcn-panel{flex:none;width:100%;max-width:none;border-right:0;
  padding:1.25rem 1.4rem 2rem;max-height:none;overflow:visible}
.hcn-shell .hcn-masthead{margin:-1.25rem -1.4rem 1rem}
.hcn-shell .hcn-mcard{position:static;width:auto;margin:.9rem 1.4rem 0;
  max-height:none;box-shadow:none;border:1px solid var(--rule)}
.hcn-shell .hcn-hint{display:none}
.hcn-shell h1{font-size:1.3rem}
.hcn-shell .hcn-home{display:block;text-decoration:none;
  color:inherit}
.hcn-shell .hcn-home:hover h1{text-decoration:underline;
  text-underline-offset:3px}
.hcn-shell .hcn-home::after{content:"Back to the Hackney Citizen";display:block;margin-top:.5rem;font-size:.78rem;
  letter-spacing:.04em;color:#c8c6bf}
@media (min-width:62rem){
  /* Wide enough for the panel beside the map, as on the full page. */
  /* Fill the window, less the page title above and a little
     breathing room below. */
  .hcn-shell{flex-direction:row;align-items:stretch;
    height:calc(100vh - 11rem);min-height:34rem;
    margin:1.5rem 0 1rem}
  .hcn-shell .hcn-panel{order:0;flex:0 0 22rem;max-width:22rem;
    overflow-y:auto;border-right:1px solid var(--rule)}
  .hcn-shell .hcn-stage{order:0;flex:1 1 auto;height:auto;border-bottom:0}
  .hcn-shell .hcn-mcard{position:absolute;left:16px;bottom:16px;
    width:min(24rem,64%);margin:0;
    box-shadow:0 12px 30px rgba(26,26,26,.26)}
}

</style>
