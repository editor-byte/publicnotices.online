# Rebuilds the objections page every week and publishes it.
#
# Road changes and planning are fetched separately. If one fails, the page
# is still published, using that source's last good copy, and this run is
# marked as failed so GitHub emails you. Nothing is published only if there
# is no saved copy to fall back on or the page itself fails its checks;
# then the previous page stays live.
#
# Run it by hand: the repo's Actions tab → "Weekly objections page" →
# "Run workflow".

name: Weekly objections page

on:
  schedule:
    - cron: "0 7 * * 2"        # Tuesdays 07:00 UTC (8am in summer, 7am in winter)
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Europe/London            # "today" means today in Hackney
  PAGE: objections.html        # where the live page sits in the repo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and check
        run: bash scripts/weekly.sh

      - name: Publish
        run: |
          cp scripts/objections.html "$PAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PAGE" scripts/planning-from-notices.csv scripts/last-good
          if git diff --cached --quiet; then
            echo "nothing changed this week"
          else
            git commit -m "Weekly rebuild of the objections page"
            git pull --rebase
            git push
          fi

      - name: Report any fallback
        run: |
          if [ -s scripts/fallbacks.txt ]; then
            while read -r line; do echo "::error::$line"; done < scripts/fallbacks.txt
            exit 1
          fi
