name: Rebuild and publish

# 06:20 UTC daily. GitHub schedules in UTC and does not follow BST, so this
# is 7.20am British Summer Time and 6.20am in winter. Minute 20 rather than
# 00 because GitHub's schedulers are busiest on the hour and jobs queued
# then are the most likely to be delayed or dropped.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - "planning-from-notices.csv"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No pip install step: every script is standard library only.

      # ---- roads ------------------------------------------------------
      - name: Rebuild and check
        # weekly.sh fetches roads and planning separately, falls back on
        # last-good/ if either fails, and fails the run if it has to.
        run: bash scripts/weekly.sh

      - name: Assemble what Cloudflare will serve
        run: |
          mkdir -p public
          cp scripts/objections.html public/index.html
          cp scripts/hackney.pmtiles public/
          cp CNAME public/CNAME 2>/dev/null || true
          ls -la public

      - name: Keep the inputs for inspection
        # When a figure on the page looks wrong, the exact inputs for every
        # build are downloadable from the run for 14 days.
        uses: actions/upload-artifact@v4
        with:
          name: build-data
          retention-days: 14
          path: |
            scripts/traffic_probe/*.csv
            scripts/traffic_probe/*.geojson
            scripts/weekly_lists/*.csv
            scripts/planning-applications.csv
            scripts/fallbacks.txt

      # ---- publish ----------------------------------------------------
      # Cloudflare holds its own copy of the files; GitHub is the engine,
      # not the host. If this step fails the run must go red, or a green
      # tick would mean a build that never reached anyone.
      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.151.3"
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
