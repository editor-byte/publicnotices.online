name: Rebuild and publish

# 06:20 UTC daily. GitHub schedules in UTC and does not follow BST, so this
# is 7.20am British Summer Time and 6.20am in winter. Minute 20 rather than
# 00 because GitHub's schedulers are busiest on the hour and jobs queued
# then are the most likely to be delayed or dropped.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - "planning-from-notices.csv"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No pip install step: every script is standard library only.

      # ---- roads ------------------------------------------------------
      - name: Fetch current traffic orders
        run: python3 scripts/traffic_ingest.py

      - name: Check the traffic feed returned something
        # A silent empty result would publish a page claiming nothing is
        # open. Zero schemes open is legitimate; zero records is not.
        run: |
          f=$(ls -1 traffic_probe/traffic-geometry-*.geojson 2>/dev/null | tail -1)
          if [ -z "$f" ]; then
            echo "::error::No geometry file produced — Traffweb may have changed"
            exit 1
          fi
          n=$(python3 -c "import json;print(len(json.load(open('$f'))['features']))")
          echo "$n restriction records"
          [ "$n" -ge 1 ] || { echo "::error::Traffweb returned no records"; exit 1; }

      # ---- planning ---------------------------------------------------
      # The source is Hackney's weekly consultation sheets, not the printed
      # notices. The sheets carry no comment deadline, so the deadlines
      # established from the printed notices are merged back in by
      # reference from planning-from-notices.csv, which is committed.
      - name: Fetch the council's weekly consultation sheets
        run: python3 scripts/fetch_weekly_lists.py --weeks 12

      - name: Build the planning rows
        run: |
          python3 scripts/parse_weekly_lists.py \
            --deadlines planning-from-notices.csv \
            --out planning-applications.csv

      - name: Check the planning data looks sane
        run: |
          n=$(python3 -c "import csv;print(sum(1 for _ in csv.DictReader(open('planning-applications.csv'))))")
          echo "$n planning applications"
          [ "$n" -ge 50 ] || { echo "::error::Too few applications — the council's sheets may have moved or changed shape"; exit 1; }
          d=$(python3 -c "import csv;print(sum(1 for r in csv.DictReader(open('planning-applications.csv')) if r['comment_deadline']))")
          echo "$d of them carry a published comment deadline"

      # ---- page -------------------------------------------------------
      - name: Build the page
        run: |
          mkdir -p public
          DATA="--wards data/hackney-wards.json \
                --roads data/hackney-roads.json \
                --postcodes data/hackney-postcodes.json"
          python3 scripts/build_objections_page.py --fullpage $DATA \
            --out public/index.html
          python3 scripts/build_objections_page.py $DATA --out public/card.html
          cp CNAME public/CNAME 2>/dev/null || true
          ls -la public

      - name: Keep the inputs for inspection
        # When a figure on the page looks wrong, the exact inputs for every
        # build are downloadable from the run for 14 days.
        uses: actions/upload-artifact@v4
        with:
          name: build-data
          retention-days: 14
          path: |
            traffic_probe/*.csv
            traffic_probe/*.geojson
            weekly_lists/*.csv
            planning-applications.csv

      # ---- publish ----------------------------------------------------
      # Cloudflare holds its own copy of the files; GitHub is the engine,
      # not the host. If this step fails the run must go red, or a green
      # tick would mean a build that never reached anyone.
      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
